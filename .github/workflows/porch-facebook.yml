name: Porch → Facebook

# Posts each new Vero Porch / Sebastian Porch article to the Covenant Builders
# Facebook Page once its page is live. Needs repo secrets FB_PAGE_ID and
# FB_PAGE_TOKEN; without them the job does nothing. Safe to re-run: it skips
# articles already on the Page.

on:
  push:
    branches: [main]
    paths:
      - 'content/porch-articles/*.json'
      - 'content/sebastian-porch-articles/*.json'
  schedule:
    # Catch-up runs (UTC): picks up anything that was not live yet or failed.
    - cron: '17 12,15,18,21 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post only this article slug (optional)'
        required: false
      dry_run:
        description: 'Dry run — show what would post, post nothing'
        type: boolean
        default: false

concurrency:
  group: porch-facebook
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post new articles to Facebook
        run: node scripts/post-porch-facebook.mjs
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          SLUG: ${{ github.event.inputs.slug }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
